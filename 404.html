<!DOCTYPE html>
<html>
<head>
  <!-- 
    FIX: Changed to "/" for custom domains. 
    This ensures main.dart.js loads correctly even on a refreshed deep link.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nyayi">

  <!-- Favicon -->
  <link rel="icon" href="nyayi.png" sizes="any"/>
  
  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="nyayi" />
  <meta property="og:description" content="Discover Your Radiant Beauty with nyayi: Where Elegance Meets Brilliance" />
  <meta property="og:image" content="/assets/assets/images/logo.png" /> 
  <meta name="twitter:title" content="nyayi" />
  <meta name="twitter:description" content="Discover Your Radiant Beauty with nyayi: Where Elegance Meets Brilliance" />
  <meta name="twitter:image" content="/assets/assets/images/logo.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>nyayi</title>
  <meta name="description" content="Discover Your Radiant Beauty with nyayi: Where Elegance Meets Brilliance" />
    
  <!-- Status Bar color in Safari browser (iOS) and PWA: Changed to Brown (#8B4513) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#8B4513">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#8B4513">

  <link rel="manifest" href="manifest.json">
  
</head>
<body>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=');
      });
    }
  </script>
  <script src="main.dart.js" type="application/javascript"></script>

</body>
</html>
